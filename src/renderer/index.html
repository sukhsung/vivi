<!doctype html>
<html>
  <head>
    <title>Vivi</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: http://localhost:*"
    />

    <script src="../../node_modules/instrument-ui/src/renderer/js/chart.js"></script>
    <link
      href="../../node_modules/instrument-ui/src/renderer/css/fonts.css"
      rel="stylesheet"
    />
    <link href="./css/output.css" rel="stylesheet" />
  </head>

  <body>
    <div class="title-bar">
      <span class="title-text">vivi</span>
      <div class="ml-auto flex">
        <button id="PB_win_min" class="win-btn">&#x2212;</button>
        <button id="PB_win_max" class="win-btn">&#x25A1;</button>
        <button id="PB_win_close" class="win-btn win-btn-close">
          &#x2715;
        </button>
      </div>
    </div>

    <div
      id="main-container"
      class="grid h-full min-h-0 grid-rows-[1fr_65px] gap-3 overflow-hidden"
    >
      <div
        id="panel_top"
        class="grid min-h-0 grid-cols-4 gap-3 overflow-hidden"
      >
        <div
          id="panel_left"
          class="bg-app-500 shadow-box relative col-span-1 min-h-0 overflow-hidden px-6 pt-6 pb-0"
        >
          <div
            id="connection"
            class="flex h-full flex-col items-center justify-center"
          >
            <div class="w-full">
              <img src="../assets/app-main.svg" class="m-auto w-8/12" />
            </div>
          </div>

          <!-- Control  -->
          <div
            id="control"
            class="grid hidden h-full grid-cols-1 grid-rows-[1fr_5fr_1fr] gap-4 py-4"
          >
            <!-- All Channel Settings-->
            <div
              class="shadow-box my-2 grid w-full grid-cols-2 gap-4 bg-white p-6"
            >
              <!-- Address -->
              <div>
                <label class="mb-1"> Sampling (Hz) </label>
                <div class="flex items-center gap-2">
                  <input
                    id="TB_sampling"
                    type="number"
                    min="0"
                    step="any"
                    value="400"
                    class="flex h-9 w-full items-center justify-center"
                  />
                </div>
              </div>
              <!-- All Channel Gains -->
              <div>
                <label class="mb-1"> All Gains </label>
                <select id="CB_allGains" class="w-full"></select>
              </div>
            </div>

            <!-- ADC Settings -->
            <div
              class="shadow-box relative flex h-full w-full flex-col overflow-hidden bg-white"
            >
              <div
                id="div_scrollbox"
                class="w-full flex-1 overflow-y-scroll p-4"
              >
                <div id="div_ADCs"></div>
              </div>

              <div
                id="scroll-indicator"
                class="text-app-500 border-app-500 pointer-events-none absolute bottom-2 left-1/2 z-30 h-7 w-7 -translate-x-1/2 animate-bounce rounded-full border bg-white text-center text-lg"
              >
                ↓
              </div>
              <div
                id="adc-gradient-t"
                class="pointer-events-none absolute top-0 left-0 z-20 hidden h-6 w-full rounded-t-xl bg-gradient-to-b from-gray-300 to-transparent transition-opacity duration-300"
              ></div>
              <div
                id="adc-gradient-b"
                class="pointer-events-none absolute bottom-0 left-0 z-20 hidden h-6 w-full rounded-b-xl bg-gradient-to-t from-gray-300 to-transparent transition-opacity duration-300"
              ></div>
            </div>
          </div>

          <div
            id="busy_left"
            class="bg-app-500/50 pointer-events-none absolute inset-0 z-50 flex flex-col items-center justify-center rounded-xl opacity-0 backdrop-blur-sm transition-opacity duration-300"
          >
            <div id="busy_left_status" class="text-center text-white">
              Acquisition in Progress...
            </div>
            <div class="w-full items-center text-center">
              <img src="../assets/app-main.svg" class="m-auto w-8/12" />
            </div>
          </div>
        </div>

        <div
          id="panel_right"
          class="relative col-span-3 min-h-0 overflow-hidden"
        >
          <div
            id="viewer"
            class="grid h-full min-h-0 grid-rows-[3fr_4fr] gap-2"
          >
            <div
              id="panel_view"
              class="shadow-box grid h-full min-h-0 grid-cols-[minmax(240px,1fr)_4fr] grid-rows-1 gap-4 bg-white p-6"
            >
              <div
                class="shadow-box h-full min-h-0 w-full overflow-hidden px-2 py-2"
              >
                <div class="grid w-full grid-cols-5 p-2">
                  <label class="col-span-3 text-sm"># FFT Samples </label>
                  <input
                    id="TB_NUM_FFT"
                    type="number"
                    min="16"
                    step="1"
                    value="1024"
                    class="col-span-2 h-7 rounded border border-slate-200 text-center text-sm hover:border-slate-400"
                  />
                </div>

                <div class="grid w-full grid-cols-5 p-2">
                  <label class="col-span-3 text-sm"># Average </label>
                  <input
                    id="TB_NUM_AVE"
                    type="number"
                    min="1"
                    step="1"
                    value="1"
                    class="col-span-2 h-7 rounded border border-slate-200 text-center text-sm hover:border-slate-400"
                  />
                </div>

                <div class="grid w-full grid-cols-5 p-2">
                  <label class="col-span-3 text-sm">Acquisition (s) </label>
                  <input
                    id="TB_acquireTime"
                    type="number"
                    min="0"
                    step="1"
                    value="120"
                    class="col-span-2 h-7 rounded border border-slate-200 text-center text-sm hover:border-slate-400"
                  />
                </div>

                <div class="grid w-full grid-cols-5 p-2">
                  <label class="col-span-3 text-sm">Delay (s) </label>
                  <input
                    id="TB_delayTime"
                    type="number"
                    min="0"
                    step="1"
                    value="0"
                    class="col-span-2 h-7 rounded border border-slate-200 text-center text-sm hover:border-slate-400"
                  />
                </div>

                <div class="flex gap-4 p-2 text-center">
                  <button id="PB_view_start" class="flex-1">Live</button>
                  <button id="PB_acquire_start" class="flex-1">Acquire</button>
                  <button id="PB_stop" class="button-pink flex-1">
                    Stop Acquisition
                  </button>
                </div>
                <div class="py-3">
                  <div class="h-3 w-full rounded-full bg-slate-200">
                    <div
                      id="progress"
                      class="bg-app-500 animate-flicker h-full rounded-full transition-all duration-10"
                      style="width: 0%"
                    ></div>
                  </div>
                </div>
              </div>
              <div id="livefft" class="shadow-box h-full w-full bg-white p-4">
                <canvas id="canvas_live" class="h-full w-full"></canvas>
              </div>
            </div>
            <div
              id="panel_waterfall"
              class="shadow-box grid h-full min-h-0 grid-cols-[80px_1fr] gap-2 bg-white p-6"
            >
              <div class="tab-group flex w-full flex-col">
                <div id="tabList" class="shadow-box flex flex-col p-1"></div>
                <div class="shadow-box mt-auto flex flex-col p-1">
                  <a href="#" id="PB_cmap" class="tab tab_black">Viridis</a>
                </div>
              </div>

              <div
                id="waterfall min-h-0 "
                class="shadow-box h-full min-h-0 w-full overflow-hidden p-6"
              >
                <canvas
                  id="canvas_waterfall"
                  class="h-full w-full rounded-xl border bg-black"
                ></canvas>
              </div>
            </div>
          </div>
          <div
            id="busy_right"
            class="bg-app-500/50 pointer-events-none absolute inset-0 z-50 flex flex-col items-center justify-center rounded-xl opacity-0 backdrop-blur-xs transition-opacity duration-300"
          >
            <div class="text-white">Connect to a Device to Continue...</div>
          </div>
        </div>
      </div>

      <div id="panel_bottom">
        <div class="shadow-box bg-panel-50 grid h-full gap-3">
          <div class="grid grid-cols-[1fr_auto_auto_auto] gap-1">
            <div id="panel_path" class="my-auto px-4">
              <div class="grid grid-cols-[minmax(0,1fr)_auto] gap-2">
                <div class="my-auto">
                  <div id="div_path" class="w-full truncate">
                    Save Path: <output id="TB_path">Not Selected</output>
                  </div>
                </div>
                <div class="ml-auto">
                  <button id="PB_browse">Select</button>
                  <button id="PB_open">Open</button>
                </div>
              </div>
            </div>

            <div class="border-app-800 my-auto border-r px-4">
              <div class="grid grid-cols-[auto_minmax(0,1fr)] gap-2">
                <div class="my-auto">
                  <div id="div_log_status" class="w-full truncate">
                    <output id="TB_log">Log Status: Not Started</output>
                  </div>
                </div>
              </div>
            </div>

            <div class="ml-auto flex w-full gap-2 px-4 py-3 text-center">
              <button id="PB_device_manager" class="">Device Manager</button>

              <button
                id="terminal"
                class="aspect-square h-full items-center p-0"
              >
                <img
                  src="../../node_modules/instrument-ui/src/assets/UI_icons/terminal.svg"
                  class="keyboard-icon-on mx-auto h-10 w-10"
                />
              </button>
              <button
                id="PB_keyboard"
                class="aspect-square h-full items-center p-0"
              >
                <img
                  src="../../node_modules/instrument-ui/src/assets/UI_icons/keyboard_on.svg"
                  class="keyboard-icon-on mx-auto h-10 w-10"
                />
                <img
                  src="../../node_modules/instrument-ui/src/assets/UI_icons/keyboard_off.svg"
                  class="keyboard-icon-off mx-auto h-10 w-10"
                />
              </button>
              <button
                id="PB_info"
                class="aspect-square h-full items-center p-0"
              >
                <img
                  src="../../node_modules/instrument-ui/src/assets/UI_icons/info.svg"
                  class="keyboard-icon-on mx-auto h-8 w-8"
                />
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <template id="adc-setting-template">
      <div
        class="adc-setting shadow-box mb-2 grid gap-2 py-2 pr-2 pl-6 shadow-sm"
      >
        <!-- Top Row: Label + Collapse Button -->
        <div class="flex items-center justify-between text-sm">
          <div class="adc_name">ADC X</div>
          <div>
            <label>Label:</label>
            <input class="w-20" type="text" value="Ch 1" />
          </div>
          <button
            class="collapse-btn flex h-5 w-5 items-center justify-center rounded-full p-0"
          >
            <svg
              class="h-4 w-4 transition-transform"
              viewBox="0 0 24 24"
              fill="currentColor"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M7 10l5 5 5-5H7z" />
            </svg>
          </button>
        </div>

        <!-- Collapsible Content -->
        <div class="adc-settings-body flex hidden flex-col gap-2">
          <!-- Gain -->
          <div>
            <label>Gain:</label>
            <select class="h-7 p-1 text-sm"></select>
          </div>

          <!-- Polarity -->
          <div>
            <label>Polarity:</label>
            <select class="h-7 p-1 text-sm">
              <option>unipolar</option>
              <option>bipolar</option>
            </select>
          </div>

          <!-- Buffer -->
          <div>
            <label>Buffer:</label>
            <select class="h-7 p-1 text-sm">
              <option>unbuffered</option>
              <option>buffered</option>
            </select>
          </div>
        </div>
      </div>
    </template>

    <script src="js/renderer.js" type="module" defer></script>
  </body>
</html>
